name: Packages

# Checks the npm packages in this workspace (those not marked "private") the way they will be
# published: release metadata, and the packed tarball's exports and types.

on:
  pull_request:
    paths:
      - "packages/**"
      - "themes/**"
      - ".changeset/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/release-plan.mjs"
      - ".github/workflows/packages.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/release-plan.mjs --check
      - run: pnpm install --frozen-lockfile
      - name: Pack and lint each package
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in $(node scripts/release-plan.mjs --dirs); do
            echo "::group::$dir"
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs/$(basename "$dir")")
            tarball=$(ls "$RUNNER_TEMP/packs/$(basename "$dir")"/*.tgz)
            pnpm dlx publint@0.3.25 --strict --pack pnpm "$dir"
            pnpm dlx @arethetypeswrong/cli@0.18.5 --profile esm-only "$tarball"
            echo "::endgroup::"
          done
