name: Release

# Release management with Changesets (https://github.com/changesets/changesets):
#
# - While `.changeset/` holds changesets, the `version` job keeps a "Version Packages" pull
#   request up to date: `changeset version` bumps versions and writes CHANGELOG.md.
# - The commit that merges it (one that bumps a package's version that isn't on npm yet)
#   packs the package and *stages* it on npm with `npm stage publish`, and drafts a GitHub
#   release with its CHANGELOG section as the notes. A maintainer then approves the staged
#   version with 2FA (npmjs.com or `npm stage approve`), which makes it public, and publishes
#   the draft release. Re-running a run, or running the workflow by hand, retries packages
#   that aren't on npm.
#
# Publishing uses our own pack/publish jobs rather than `changeset publish`, because
# Changesets can't stage, and so the job that holds publish rights never runs repository code.
#
# npm authenticates the publish job by trusted publishing (OIDC): no npm token is stored, and
# provenance is attached automatically. The trusted publisher on npmjs.com must name this file
# (release.yml) and the `npm` environment, and only needs to allow `npm stage publish`.
# Packing runs the packages' build scripts in a job without publish rights; the publish job
# only uploads the tarballs and never runs repo code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.plan.outputs.has-changesets }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the previous commit, to tell which versions this push bumped
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "Changesets are pending; the version job updates the Version Packages pull request."
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A staged version isn't on npm until it's approved, so on pushes only the commit that
          # bumps a version stages it; a manual run retries anything not on npm.
          if [ "$EVENT" = push ]; then
            packages=$(node scripts/release-plan.mjs --changed-since HEAD^)
          else
            packages=$(node scripts/release-plan.mjs)
          fi
          echo "Packages to release: $packages"
          echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  version:
    needs: plan
    if: needs.plan.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the version commit
      pull-requests: write # to open the Version Packages pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Runs `changeset version` (the changelog generator reads PR links with GITHUB_TOKEN,
      # which the action provides) and copies versions into Claude plugin manifests.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version-packages

  pack:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-plan.mjs --check
      - name: Test and pack
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          jq -c '.[]' <<< "$PACKAGES" | while read -r item; do
            dir=$(jq -r .dir <<< "$item")
            name=$(jq -r .name <<< "$item")
            pnpm --filter "$name" run --if-present test
            # pnpm applies publishConfig, and prepack builds the package.
            out=$(mktemp -d)
            (cd "$dir" && pnpm pack --pack-destination "$out")
            mv "$out"/*.tgz "$RUNNER_TEMP/release/$(jq -r .tag <<< "$item" | tr '/@' '__').tgz"
          done
          jq . <<< "$PACKAGES" > "$RUNNER_TEMP/release/plan.json"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/*.*
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # to create draft GitHub releases
      id-token: write # for npm trusted publishing
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `npm stage publish` needs npm >= 11.15.0; Node 24 ships with a newer one.
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Stage on npm and draft GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' release/plan.json | while read -r item; do
            name=$(jq -r .name <<< "$item")
            version=$(jq -r .version <<< "$item")
            tag=$(jq -r .tag <<< "$item")
            tarball="./release/$(tr '/@' '__' <<< "$tag").tgz"

            # Drafted first, so a re-run after a failed stage still finds it. Drafts aren't
            # found by tag (the tag is only created when the release is published), so list them.
            if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -Fxq "$tag"; then
              echo "$tag already has a GitHub release."
            else
              # The CHANGELOG section for this version (written by `changeset version`), without its heading.
              { tar -xzOf "$tarball" package/CHANGELOG.md 2> /dev/null || true; } \
                | awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
                > notes.md
              [ -s notes.md ] || echo "See the package's CHANGELOG.md." > notes.md
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$tag" --notes-file notes.md --draft
            fi

            if npm view "$name@$version" version --json > /dev/null 2>&1; then
              echo "$tag is already on npm."
            else
              npm stage publish "$tarball" --access public
              echo "::notice title=$tag staged::Approve it on https://www.npmjs.com/package/$name (Staged Packages) or with npm stage approve, then publish its draft GitHub release."
            fi
          done
