name: Release

# Publishes each workspace package (not marked "private") whose version isn't on npm yet, and
# creates its GitHub release with notes from its CHANGELOG.md. To release, bump `version` (and
# add a CHANGELOG section) in a pull request; merging it publishes.
#
# npm authenticates this workflow by trusted publishing (OIDC): no npm token is stored, and
# provenance is attached automatically. The trusted publisher on npmjs.com must name this file
# (release.yml) and the `npm` environment. Packing runs the packages' build scripts in a job
# without publish rights; the publish job only uploads the tarballs and never runs repo code.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "themes/**"
      - "scripts/release-plan.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=$(node scripts/release-plan.mjs)
          echo "Packages to release: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  pack:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-plan.mjs --check
      - name: Test and pack
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          jq -c '.[]' <<< "$PACKAGES" | while read -r item; do
            dir=$(jq -r .dir <<< "$item")
            name=$(jq -r .name <<< "$item")
            pnpm --filter "$name" run --if-present test
            # pnpm applies publishConfig, and prepack builds the package.
            out=$(mktemp -d)
            (cd "$dir" && pnpm pack --pack-destination "$out")
            mv "$out"/*.tgz "$RUNNER_TEMP/release/$(jq -r .tag <<< "$item" | tr '/@' '__').tgz"
          done
          jq . <<< "$PACKAGES" > "$RUNNER_TEMP/release/plan.json"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/*.*
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # to create tags and GitHub releases
      id-token: write # for npm trusted publishing
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 ships with it.
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish to npm and create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' release/plan.json | while read -r item; do
            name=$(jq -r .name <<< "$item")
            version=$(jq -r .version <<< "$item")
            tag=$(jq -r .tag <<< "$item")
            tarball="./release/$(tr '/@' '__' <<< "$tag").tgz"

            if npm view "$name@$version" version --json > /dev/null 2>&1; then
              echo "$tag is already on npm."
            else
              npm publish "$tarball" --access public
            fi

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag already has a GitHub release."
            else
              # The CHANGELOG section for this version, without its heading.
              tar -xzOf "$tarball" package/CHANGELOG.md \
                | awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
                > notes.md
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$tag" --notes-file notes.md
            fi
          done
